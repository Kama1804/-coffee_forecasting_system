{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}

<div class="page-header" data-aos="fade-down">
    <div>
        <h1 class="page-title">{{ page_title }}</h1>
        <p class="page-subtitle">{{ page_subtitle }}</p>
    </div>
</div>

<div class="dashboard-card text-center" style="padding: var(--space-2xl);" data-aos="fade-up">
    <div class="empty-state">
        <div class="empty-state-icon">
            <i class="fa-solid {{ page_icon }}" style="font-size:3rem;opacity:.3;"></i>
        </div>
        <div class="empty-state-title" style="font-size:1.1rem;">Coming Soon</div>
        <p class="empty-state-text">
            This section is actively being built as part of Phase 3.<br>
            Check back once the corresponding timeline task is complete.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn-primary-custom mt-4">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>
</div>

{% endblock %}
