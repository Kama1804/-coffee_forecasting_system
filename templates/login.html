<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login | MCS Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body.login-bg {
            background-color: var(--navy-sidebar);
            background-image:
                radial-gradient(circle at 20% 50%, rgba(59,130,246,.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(245,158,11,.06) 0%, transparent 40%),
                radial-gradient(circle at 50% -20%, #2A3B52 0%, var(--navy-sidebar) 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-md);
        }
        .login-card {
            background-color: var(--white-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: var(--space-2xl) var(--space-xl);
            animation: slideUp .55s cubic-bezier(.16,1,.3,1);
        }
        @keyframes slideUp {
            from { opacity:0; transform: translateY(28px); }
            to   { opacity:1; transform: translateY(0);    }
        }
        .login-icon {
            width: 58px; height: 58px;
            background: linear-gradient(135deg, var(--amber-kpi), #D97706);
            border-radius: var(--radius-lg);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; color: white;
            margin: 0 auto var(--space-md);
            box-shadow: 0 8px 20px rgba(245,158,11,.28);
        }
        .login-title    { text-align:center; font-size:1.4rem; margin-bottom:2px; color:var(--text-main); }
        .login-subtitle { text-align:center; font-size:.85rem; color:var(--text-muted); margin-bottom:var(--space-xl); }

        .input-wrap {
            position: relative;
            margin-bottom: var(--space-md);
        }
        .input-wrap .input-icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
            transition: color .2s ease;
            font-size: .9rem;
        }
        .input-wrap input {
            width: 100%;
            padding: .78rem 1rem .78rem 2.6rem;
            font-size: .925rem;
            font-family: var(--font-main);
            border: 2px solid var(--grey-border);
            border-radius: var(--radius-md);
            background-color: var(--grey-canvas);
            color: var(--text-main);
            transition: var(--transition-base);
            outline: none;
        }
        .input-wrap input:focus {
            border-color: var(--slate-accent);
            background-color: var(--white-card);
            box-shadow: 0 0 0 4px rgba(59,130,246,.1);
        }
        .input-wrap input:focus ~ .input-icon { color: var(--slate-accent); }

        /* show password toggle */
        .input-wrap .toggle-pw {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            cursor: pointer;
            font-size: .9rem;
            transition: color .2s;
        }
        .input-wrap .toggle-pw:hover { color: var(--slate-accent); }

        .btn-login {
            width: 100%; padding: .82rem;
            font-size: .975rem;
            justify-content: center;
            margin-top: var(--space-sm);
        }

        .flash-container {
            position: fixed;
            top: var(--space-lg); left: 50%;
            transform: translateX(-50%);
            width: 100%; max-width: 420px;
            z-index: 1050;
            padding: 0 var(--space-md);
        }

        .login-footer {
            text-align: center;
            margin-top: var(--space-lg);
            font-size: .78rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body class="login-bg">

    <!-- Flash messages -->
    <div class="flash-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}
                                alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm"
                         role="alert">
                        <i class="fa-solid {{ 'fa-circle-exclamation' if category == 'error' else 'fa-circle-check' }}"></i>
                        <span style="font-size:.9rem;">{{ message }}</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="login-card">
        <!-- Brand icon -->
        <div class="login-icon">
            <i class="fa-solid fa-mug-hot"></i>
        </div>

        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Sign in to access MCS Analytics</p>

        <form action="{{ url_for('login') }}" method="POST" autocomplete="off">

            <!-- Username -->
            <div class="input-wrap">
                <input type="text" name="username" placeholder="Username"
                       required autocomplete="off" spellcheck="false">
                <span class="input-icon"><i class="fa-solid fa-user"></i></span>
            </div>

            <!-- Password -->
            <div class="input-wrap">
                <input type="password" name="password" id="passwordField"
                       placeholder="Password" required>
                <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                <span class="toggle-pw" onclick="togglePassword()" title="Show/hide password">
                    <i class="fa-solid fa-eye" id="eyeIcon"></i>
                </span>
            </div>

            <button type="submit" class="btn-primary-custom btn-login">
                Sign In &nbsp;<i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <div class="login-footer">
            Mini Coffee Shop &mdash; AI Analytics Dashboard &copy; 2026
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-dismiss alerts
        document.querySelectorAll('.alert').forEach(el => {
            setTimeout(() => {
                const a = bootstrap.Alert.getOrCreateInstance(el);
                if (a) a.close();
            }, 4500);
        });

        // Show/hide password
        function togglePassword() {
            const field   = document.getElementById('passwordField');
            const icon    = document.getElementById('eyeIcon');
            const isHidden = field.type === 'password';
            field.type = isHidden ? 'text' : 'password';
            icon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        }
    </script>
</body>
</html>
